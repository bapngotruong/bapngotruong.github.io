<style>
        /* Khai báo Font chữ */
        @font-face {
            font-family: 'BNTFONT';
            src: url('BNTFONT-Regular.otf') format('opentype'),
                 url('BNTFONT-Regular.ttf') format('truetype');
        }

        :root {
            --brand-red: #e02120;
            --brand-black: #191c1e;
            --text-grey: #6b6b6b;
            --light-grey: #f4f6f7;
            --pure-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'BNTFONT', 'Inter', 'Montserrat', sans-serif;
            background-color: var(--pure-white);
            color: var(--brand-black);
            overflow-x: hidden;
        }

        /* ================= HEADER ================= */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: var(--pure-white);
        }

        .logo img {
            height: 60px;
            object-fit: contain;
        }

        .nav-container {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-grey);
            font-weight: 600;
            font-size: 15px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--brand-black);
        }

        .btn-start {
            background-color: var(--brand-black);
            color: var(--pure-white);
            padding: 10px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.3s;
        }

        .btn-start:hover {
            background-color: var(--brand-red);
        }

        /* ================= HERO SECTION ================= */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 8% 80px;
            min-height: calc(100vh - 100px);
            position: relative;
            gap: 40px;
        }

        .hero-content {
            flex: 1;
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        .tagline {
            color: var(--text-grey);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-content h1 {
            font-size: 4.2rem;
            line-height: 1.1;
            font-weight: 800;
            color: #222;
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .hero-content p {
            font-size: 1.15rem;
            color: var(--text-grey);
            line-height: 1.6;
            max-width: 450px;
        }

        /* --- SLIDER ẢNH --- */
        .hero-slider-container {
            flex: 1;
            height: 550px;
            position: relative;
            display: flex;
            justify-content: center;
        }

        .slider {
            width: 100%;
            max-width: 400px;
            height: 100%;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            background-color: var(--pure-white);
        }

        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            width: 35px;
            height: 50px;
            cursor: pointer;
            font-size: 20px;
            z-index: 10;
            transition: background-color 0.3s;
        }

        .slider-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .prev-btn { left: 0; border-radius: 0 5px 5px 0; }
        .next-btn { right: 0; border-radius: 5px 0 0 5px; }

        .slider-dots {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 9px;
            height: 9px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background-color: var(--brand-red);
            width: 11px;
            height: 11px;
        }

        /* ================= RESPONSIVE CHO ĐIỆN THOẠI ================= */
        @media (max-width: 900px) {
            header {
                padding: 15px 5%;
            }
            nav ul {
                display: none; /* Ẩn menu chữ trên mobile nếu muốn gọn, hoặc giữ lại tùy ý bạn */
            }
            .hero {
                flex-direction: column;
                height: auto;
                min-height: auto;
                padding: 30px 5% 60px;
                text-align: center;
                gap: 40px;
            }
            .hero-content {
                max-width: 100%;
            }
            .hero-content h1 {
                font-size: 2.8rem; /* Thu nhỏ chữ tiêu đề để không bị tràn màn hình điện thoại */
                margin-bottom: 20px;
            }
            .hero-content p {
                margin: 0 auto;
                font-size: 1rem;
            }
            .hero-slider-container {
                width: 100%;
                height: 420px; /* Thu nhỏ chiều cao slider trên mobile */
            }
            .slider {
                max-width: 300px; /* Vừa vặn với màn hình điện thoại dọc */
            }
        }
    </style>
